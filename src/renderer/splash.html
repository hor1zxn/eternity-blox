<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EternityBlox Startup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }

    .splash-container {
      width: 480px;
      height: 290px;
      background: radial-gradient(circle at 50% 0%, rgba(32, 38, 55, 0.6) 0%, rgba(9, 10, 15, 0.98) 75%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 24px;
      position: relative;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Ambient top glow */
    .splash-container::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 120px;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Top Logo & Title */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .logo-wrapper {
      position: relative;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -6px;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
      filter: blur(14px);
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, #181b24, #0d0f15);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      overflow: hidden;
      padding: 3px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1.22);
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.3));
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
    }

    .version-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .brand-tagline {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Bottom Status & Progress */
    .status-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner.done {
      display: none;
    }

    .check-icon {
      display: none;
      width: 13px;
      height: 13px;
      color: #34d399;
    }

    .status-percent {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.4), #ffffff);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: width 0.3s ease;
    }

    .progress-track.indeterminate .progress-fill {
      width: 40%;
      animation: indeterminate 1.6s infinite ease-in-out;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.8; transform: scale(1.06); }
    }

    @keyframes indeterminate {
      0% { left: -40%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 20%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .fade-out {
      animation: fadeOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.98); }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splash-card">
    <div class="brand-section">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-box">
          <img src="../eternityblox.png" alt="EternityBlox Logo" class="logo-img">
        </div>
      </div>

      <div class="title-row">
        <span class="brand-title">ETERNITYBLOX</span>
        <span class="version-badge" id="version-display">v1.0.0</span>
      </div>

      <span class="brand-tagline">Client Orchestration Suite</span>
    </div>

    <div class="status-section">
      <div class="status-meta">
        <div class="status-left">
          <div class="spinner" id="status-spinner"></div>
          <svg class="check-icon" id="status-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span id="status-text">INITIALIZING ENGINE...</span>
        </div>
        <span class="status-percent" id="status-percent"></span>
      </div>

      <div class="progress-track indeterminate" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const statusPercent = document.getElementById('status-percent');
    const statusSpinner = document.getElementById('status-spinner');
    const statusCheck = document.getElementById('status-check');
    const progressTrack = document.getElementById('progress-track');
    const progressFill = document.getElementById('progress-fill');
    const versionDisplay = document.getElementById('version-display');
    const splashCard = document.getElementById('splash-card');

    if (window.splashApi) {
      window.splashApi.onStatus((data) => {
        if (!data) return;
        if (data.version) {
          versionDisplay.textContent = `v${data.version}`;
        }
        if (data.message) {
          statusText.textContent = data.message.toUpperCase();
        }
        if (data.state === 'downloading') {
          progressTrack.classList.remove('indeterminate');
          if (typeof data.percent === 'number') {
            const pct = Math.round(data.percent);
            progressFill.style.width = `${pct}%`;
            statusPercent.textContent = `${pct}%`;
          }
        } else if (data.state === 'ready' || data.state === 'up-to-date') {
          progressTrack.classList.remove('indeterminate');
          progressFill.style.width = '100%';
          statusSpinner.classList.add('done');
          statusCheck.style.display = 'block';
          statusPercent.textContent = '100%';
        } else if (data.state === 'checking') {
          progressTrack.classList.add('indeterminate');
          statusPercent.textContent = '';
        }
      });

      window.splashApi.onClosing(() => {
        splashCard.classList.add('fade-out');
      });
    }
  </script>
</body>
</html>
